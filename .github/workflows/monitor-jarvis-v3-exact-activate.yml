name: Monitor JARVIS Gateway V3 Exact Activation

on:
  push:
    branches:
      - jarvis-v3-activation-monitor

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and extract safe VPS diagnostic output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: 88075845684
        run: |
          set -Eeuo pipefail
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o job-download.bin

          if unzip -t job-download.bin >/dev/null 2>&1; then
            unzip -p job-download.bin > job.log
          else
            cp job-download.bin job.log
          fi

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path('job.log').read_text(encoding='utf-8', errors='replace')
          raw = re.sub(r'\x1b\[[0-9;]*m', '', raw)
          rows = []
          for line in raw.splitlines():
              clean = re.sub(r'^.*?Z\s+', '', line).strip()
              rows.append(clean)

          precheck_pattern = re.compile(r'^PRECHECK head=[0-9a-f]{40} origin_main=[0-9a-f]{40} branch=main dirty=(?:true|false)$')
          starts = [index for index, line in enumerate(rows) if precheck_pattern.fullmatch(line)]
          state = 'ACTUAL_PRECHECK_FOUND' if starts else 'ACTUAL_PRECHECK_NOT_FOUND'
          excerpt = []
          if starts:
              start = starts[-1]
              end = next((index for index in range(start, len(rows)) if rows[index] == 'BLOCKED_DIRTY_WORKTREE_NO_CHANGES_PERFORMED'), -1)
              slice_end = end + 1 if end >= start else min(len(rows), start + 180)
              excerpt = [line for line in rows[start:slice_end] if line]
          else:
              safe_markers = ('PRECHECK ', '--- STATUS_SHORT ---', '--- UNSTAGED_NAMES ---', '--- STAGED_NAMES ---', '--- UNTRACKED_NAMES ---', '--- DIFF_STAT ---', '--- OVERLAP_WITH_TARGET ---', '--- SERVICE_PROPERTIES ---', 'BLOCKED_DIRTY_WORKTREE_NO_CHANGES_PERFORMED')
              excerpt = [line for line in rows if line.startswith(safe_markers)]

          forbidden = re.compile(r'(authorization|bearer|private[_ -]?key|known[_ -]?hosts|token|secret)', re.I)
          excerpt = [line for line in excerpt if not forbidden.search(line)][:200]
          payload = {
              'schema': 'jarvis_gateway_v3_dirty_excerpt_v2',
              'state': state,
              'source_job_id': 88075845684,
              'download_bytes': Path('job-download.bin').stat().st_size,
              'decoded_bytes': Path('job.log').stat().st_size,
              'lines': excerpt,
              'secret_values_recorded': False,
          }
          Path('dirty-excerpt.log').write_text('\n'.join(excerpt) + ('\n' if excerpt else ''), encoding='utf-8')
          Path('dirty-excerpt.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY

          cat dirty-excerpt.json

      - name: Persist safe diagnostic receipt
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = 'jarvis-v3-activation-receipts';
            const payload = JSON.parse(fs.readFileSync('dirty-excerpt.json', 'utf8'));
            payload.observed_at = new Date().toISOString();

            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              const base = await github.rest.git.getRef({ owner, repo, ref: 'heads/develop' });
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: base.data.object.sha });
            }

            let sha;
            const path = 'receipts/jarvis-v3-dirty-excerpt.json';
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path, sha,
              message: 'Record safe JARVIS V3 dirty-worktree excerpt',
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
            });

      - name: Upload safe diagnostic artifact
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-v3-dirty-excerpt
          path: |
            dirty-excerpt.log
            dirty-excerpt.json
