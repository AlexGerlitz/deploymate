name: Public Evidence Bundle

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:
    inputs:
      check_network:
        description: "Check public DNS and HTTPS endpoints"
        required: true
        type: boolean
        default: true
      publish_incident_comment:
        description: "Update the marker comment on open release incident issues"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "13 3 * * *"

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  evidence:
    name: public evidence bundle
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_AUDIT_SCHEDULED_PAUSED: ${{ vars.RELEASE_AUDIT_SCHEDULED_PAUSED }}
      STAGING_RELEASE_PAUSED: ${{ vars.STAGING_RELEASE_PAUSED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Generate evidence bundle
        shell: bash
        run: |
          set -euo pipefail

          check_network="${{ inputs.check_network }}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            check_network="true"
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            check_network="false"
          fi

          publish_incident_comment="${{ inputs.publish_incident_comment }}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            publish_incident_comment="true"
          elif [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            publish_incident_comment="false"
          fi

          branch="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            branch="${{ github.event.workflow_run.head_branch }}"
          fi

          args=(--repo "$GITHUB_REPOSITORY" --branch "$branch")
          if [ "$check_network" = "true" ]; then
            args+=(--check-network)
          fi

          python3 scripts/public_evidence_bundle.py "${args[@]}" --format json > deploymate-public-evidence.json
          python3 scripts/public_evidence_bundle.py "${args[@]}" --format markdown > deploymate-public-evidence.md
          python3 scripts/public_evidence_bundle.py "${args[@]}" --format issue-comment > deploymate-release-repair-issue-comment.md
          if [ "$publish_incident_comment" = "true" ]; then
            python3 scripts/public_evidence_bundle.py \
              "${args[@]}" \
              --format json \
              --publish-open-incident-comments > deploymate-incident-comment-publish-result.json
          else
            printf '{"published":false,"reason":"publish_incident_comment is false for this event"}\n' > deploymate-incident-comment-publish-result.json
          fi

          cat deploymate-public-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: deploymate-public-evidence
          path: |
            deploymate-public-evidence.json
            deploymate-public-evidence.md
            deploymate-release-repair-issue-comment.md
            deploymate-incident-comment-publish-result.json
          if-no-files-found: error
