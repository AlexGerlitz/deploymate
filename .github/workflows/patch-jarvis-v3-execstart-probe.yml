name: Patch JARVIS V3 Blue-Green Clone Source

on:
  push:
    branches:
      - jarvis-v3-execstart-probe-patcher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout blue-green branch
        uses: actions/checkout@v6
        with:
          ref: jarvis-v3-bluegreen-run
          fetch-depth: 0

      - name: Use authenticated origin clone
        shell: bash
        env:
          OLD_B64: ICBnaXQgY2xvbmUgLS1uby1sb2NhbCAtLW5vLWNoZWNrb3V0ICIkT0xEX1JPT1QiICIkUkVMRUFTRV9UTVAiCiAgZ2l0IC1DICIkUkVMRUFTRV9UTVAiIHJlbW90ZSBzZXQtdXJsIG9yaWdpbiAiJE9SSUdJTl9VUkwiCiAgZ2l0IC1DICIkUkVMRUFTRV9UTVAiIGNoZWNrb3V0IC0tZGV0YWNoICIkRVhQRUNURURfU0hBIgo=
          NEW_B64: ICBIT01FPS9vcHQvamFydmlzIFhER19DT05GSUdfSE9NRT0vb3B0L2phcnZpcy8uY29uZmlnIEdJVF9URVJNSU5BTF9QUk9NUFQ9MCBcCiAgICBnaXQgY2xvbmUgLS1uby1jaGVja291dCAiJE9SSUdJTl9VUkwiICIkUkVMRUFTRV9UTVAiCiAgZ2l0IC1DICIkUkVMRUFTRV9UTVAiIGNoZWNrb3V0IC0tZGV0YWNoICIkRVhQRUNURURfU0hBIgo=
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('scripts/jarvis_v3_bluegreen_activate.sh')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('clone_marker_mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "scripts/jarvis_v3_bluegreen_activate.sh"

      - name: Commit clone fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JARVIS Blue-Green Clone Bot"
          git config user.email "jarvis-bluegreen-clone@users.noreply.github.com"
          git add scripts/jarvis_v3_bluegreen_activate.sh
          git commit -m "Clone exact JARVIS release from authenticated origin"
          git push origin HEAD:jarvis-v3-bluegreen-run
