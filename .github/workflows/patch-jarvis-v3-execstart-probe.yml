name: Patch JARVIS V3 Mailbox Runtime Binds

on:
  push:
    branches:
      - jarvis-v3-execstart-probe-patcher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout blue-green branch
        uses: actions/checkout@v6
        with:
          ref: jarvis-v3-bluegreen-run
          fetch-depth: 0

      - name: Apply clean mailbox runtime binds
        shell: bash
        env:
          OLD1: 
          NEW1: 
          OLD2: QmluZFBhdGhzPSRSVU5USU1FX0JBU0UvdGFza3M6JFJFTEVBU0VfUk9PVC90YXNrcwpCaW5kUGF0aHM9JFJVTlRJTUVfQkFTRS92b2ljZTokUkVMRUFTRV9ST09UL3ZvaWNlCkVPRgo=
          NEW2: 
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('scripts/jarvis_v3_bluegreen_activate.sh')
          text = path.read_text(encoding='utf-8')
          for index in (1, 2):
              old = base64.b64decode(os.environ[f'OLD{index}']).decode('utf-8')
              new = base64.b64decode(os.environ[f'NEW{index}']).decode('utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'mailbox_marker_mismatch_{index}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "scripts/jarvis_v3_bluegreen_activate.sh"

      - name: Commit mailbox bind fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JARVIS Mailbox Bind Bot"
          git config user.email "jarvis-mailbox-bind@users.noreply.github.com"
          git add scripts/jarvis_v3_bluegreen_activate.sh
          git commit -m "Bind JARVIS mailbox runtime without dirtying release"
          git push origin HEAD:jarvis-v3-bluegreen-run
