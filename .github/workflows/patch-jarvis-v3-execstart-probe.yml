name: Patch JARVIS V3 Exact ExecStart Contract

on:
  push:
    branches:
      - jarvis-v3-execstart-probe-patcher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout blue-green branch
        uses: actions/checkout@v6
        with:
          ref: jarvis-v3-bluegreen-run
          fetch-depth: 0

      - name: Apply exact systemd contract
        shell: bash
        env:
          OLD1: 
          NEW1: 
          OLD2: Y2F0ID4gIiREUk9QSU5fRklMRS50bXAiIDw8RU9GCltTZXJ2aWNlXQpXb3JraW5nRGlyZWN0b3J5PSRSRUxFQVNFX1JPT1QKRU9GCg==
          NEW2: Y2F0ID4gIiREUk9QSU5fRklMRS50bXAiIDw8RU9GCltTZXJ2aWNlXQpXb3JraW5nRGlyZWN0b3J5PSRSRUxFQVNFX1JPT1QKRXhlY1N0YXJ0PQpFeGVjU3RhcnQ9L3Vzci9iaW4vbm9kZSAkUkVMRUFTRV9ST09UL3NyYy9zZXJ2ZXIubWpzCkVPRgo=
          OLD3: dGVzdCAiJChzeXN0ZW1jdGwgaXMtYWN0aXZlICIkU0VSVklDRSIpIiA9IGFjdGl2ZQp0ZXN0ICIkKHN5c3RlbWN0bCBzaG93ICIkU0VSVklDRSIgLXAgV29ya2luZ0RpcmVjdG9yeSAtLXZhbHVlKSIgPSAiJFJFTEVBU0VfUk9PVCIKSE9NRT0vb3B0L2phcnZpcyBYREdfQ09ORklHX0hPTUU9L29wdC9qYXJ2aXMvLmNvbmZpZyBucG0gcnVuIGNoZWNrOmxpdmUK
          NEW3: 
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('scripts/jarvis_v3_bluegreen_activate.sh')
          text = path.read_text(encoding='utf-8')
          for index in (1, 2, 3):
              old = base64.b64decode(os.environ[f'OLD{index}']).decode('utf-8')
              new = base64.b64decode(os.environ[f'NEW{index}']).decode('utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'marker_mismatch_{index}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "scripts/jarvis_v3_bluegreen_activate.sh"

      - name: Commit exact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JARVIS Exact ExecStart Bot"
          git config user.email "jarvis-execstart@users.noreply.github.com"
          git add scripts/jarvis_v3_bluegreen_activate.sh
          git commit -m "Support exact JARVIS V3 systemd ExecStart override"
          git push origin HEAD:jarvis-v3-bluegreen-run
