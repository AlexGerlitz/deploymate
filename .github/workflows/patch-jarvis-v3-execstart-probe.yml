name: Patch JARVIS V3 ExecStart Probe

on:
  push:
    branches:
      - jarvis-v3-execstart-probe-patcher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout blue-green branch
        uses: actions/checkout@v6
        with:
          ref: jarvis-v3-bluegreen-run
          fetch-depth: 0

      - name: Add safe ExecStart diagnostic
        shell: bash
        env:
          OLD_B64: aWYgW1sgIiRFWEVDU1RBUlRfUFJPUEVSVFkiID09ICoiJE9MRF9ST09UIiogXV07IHRoZW4KICBlY2hvICJ1bnN1cHBvcnRlZF9hYnNvbHV0ZV9leGVjc3RhcnQiID4mMgogIGV4aXQgNwpmaQo=
          NEW_B64: aWYgW1sgIiRFWEVDU1RBUlRfUFJPUEVSVFkiID09ICoiJE9MRF9ST09UIiogXV07IHRoZW4KICBwcmludGYgJ0VYRUNTVEFSVF9QUk9QRVJUWT0lc1xuJyAiJEVYRUNTVEFSVF9QUk9QRVJUWSIKICBlY2hvICJ1bnN1cHBvcnRlZF9hYnNvbHV0ZV9leGVjc3RhcnQiID4mMgogIGV4aXQgNwpmaQo=
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('scripts/jarvis_v3_bluegreen_activate.sh')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('execstart_marker_mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "scripts/jarvis_v3_bluegreen_activate.sh"

      - name: Commit probe patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JARVIS ExecStart Probe Bot"
          git config user.email "jarvis-execstart-probe@users.noreply.github.com"
          git add scripts/jarvis_v3_bluegreen_activate.sh
          git commit -m "Report JARVIS V3 absolute ExecStart safely"
          git push origin HEAD:jarvis-v3-bluegreen-run
