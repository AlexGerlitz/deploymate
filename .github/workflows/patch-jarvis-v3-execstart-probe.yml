name: Patch JARVIS V3 Live Namespace Verification

on:
  push:
    branches:
      - jarvis-v3-execstart-probe-patcher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout blue-green branch
        uses: actions/checkout@v6
        with:
          ref: jarvis-v3-bluegreen-run
          fetch-depth: 0

      - name: Run live acceptance in service namespace
        shell: bash
        env:
          OLD_B64: SE9NRT0vb3B0L2phcnZpcyBYREdfQ09ORklHX0hPTUU9L29wdC9qYXJ2aXMvLmNvbmZpZyBKQVJWSVNfVjNfU1RBVEU9IiRSVU5USU1FX0JBU0Uvc3RhdGUiIG5wbSBydW4gY2hlY2s6bGl2ZQo=
          NEW_B64: 
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('scripts/jarvis_v3_bluegreen_activate.sh')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('live_namespace_marker_mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "scripts/jarvis_v3_bluegreen_activate.sh"

      - name: Commit namespace verifier fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "JARVIS Live Namespace Bot"
          git config user.email "jarvis-live-namespace@users.noreply.github.com"
          git add scripts/jarvis_v3_bluegreen_activate.sh
          git commit -m "Verify JARVIS live runtime inside service mount namespace"
          git push origin HEAD:jarvis-v3-bluegreen-run
