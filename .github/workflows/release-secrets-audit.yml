name: Release Secrets Audit

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to audit"
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
      incident_self_test:
        description: "Manual incident self-test action"
        required: true
        type: choice
        default: none
        options:
          - none
          - open
          - update
          - resolve
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read
  issues: write

jobs:
  scheduled-paused:
    name: audit (scheduled paused)
    if: github.event_name == 'schedule' && vars.RELEASE_AUDIT_SCHEDULED_PAUSED == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Write paused summary
        shell: bash
        run: |
          {
            echo "## Release Secrets Audit"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Status: \`paused\`"
            echo "- Reason: \`RELEASE_AUDIT_SCHEDULED_PAUSED=true\`"
            echo "- Manual audit: \`workflow_dispatch\` remains available for production and staging."
          } >> "$GITHUB_STEP_SUMMARY"

  manual-audit:
    name: audit (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.incident_self_test == 'none'
    runs-on: ubuntu-latest
    concurrency:
      group: release-secrets-audit-manual-${{ inputs.target_environment }}
      cancel-in-progress: true
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run release secrets audit
        id: audit
        uses: ./.github/actions/release-secrets-audit
        with:
          target-environment: ${{ inputs.target_environment }}
          deploy-host: ${{ secrets.DEPLOY_HOST }}
          deploy-ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          deploy-ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          deploy-repo-dir: ${{ secrets.DEPLOY_REPO_DIR }}
          deploy-env-file: ${{ secrets.DEPLOY_ENV_FILE }}
          admin-username: ${{ secrets.DEPLOYMATE_ADMIN_USERNAME }}
          admin-password: ${{ secrets.DEPLOYMATE_ADMIN_PASSWORD }}
          notification-webhook: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK }}

  scheduled-production:
    name: audit (production)
    if: github.event_name == 'schedule' && vars.RELEASE_AUDIT_SCHEDULED_PAUSED != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-secrets-audit-scheduled-production
      cancel-in-progress: true
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run release secrets audit
        id: audit
        uses: ./.github/actions/release-secrets-audit
        with:
          target-environment: production
          deploy-host: ${{ secrets.DEPLOY_HOST }}
          deploy-ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          deploy-ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          deploy-repo-dir: ${{ secrets.DEPLOY_REPO_DIR }}
          deploy-env-file: ${{ secrets.DEPLOY_ENV_FILE }}
          admin-username: ${{ secrets.DEPLOYMATE_ADMIN_USERNAME }}
          admin-password: ${{ secrets.DEPLOYMATE_ADMIN_PASSWORD }}
          notification-webhook: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK }}

      - name: Triage scheduled audit incident
        if: always()
        continue-on-error: true
        uses: ./.github/actions/release-audit-incident
        with:
          target-environment: production
          job-status: ${{ job.status }}
          failure-category: ${{ steps.audit.outputs['failure-category'] }}
          operator-hint: ${{ steps.audit.outputs['operator-hint'] }}
          incident-assignee: ${{ vars.RELEASE_AUDIT_INCIDENT_ASSIGNEE }}
          incident-failure-threshold: ${{ vars.RELEASE_AUDIT_INCIDENT_FAILURE_THRESHOLD }}

  scheduled-staging:
    name: audit (staging)
    if: github.event_name == 'schedule' && vars.RELEASE_AUDIT_SCHEDULED_PAUSED != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-secrets-audit-scheduled-staging
      cancel-in-progress: true
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run release secrets audit
        id: audit
        uses: ./.github/actions/release-secrets-audit
        with:
          target-environment: staging
          deploy-host: ${{ secrets.DEPLOY_HOST }}
          deploy-ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          deploy-ssh-known-hosts: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          deploy-repo-dir: ${{ secrets.DEPLOY_REPO_DIR }}
          deploy-env-file: ${{ secrets.DEPLOY_ENV_FILE }}
          admin-username: ${{ secrets.DEPLOYMATE_ADMIN_USERNAME }}
          admin-password: ${{ secrets.DEPLOYMATE_ADMIN_PASSWORD }}
          notification-webhook: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK }}

      - name: Triage scheduled audit incident
        if: always()
        continue-on-error: true
        uses: ./.github/actions/release-audit-incident
        with:
          target-environment: staging
          job-status: ${{ job.status }}
          failure-category: ${{ steps.audit.outputs['failure-category'] }}
          operator-hint: ${{ steps.audit.outputs['operator-hint'] }}
          incident-assignee: ${{ vars.RELEASE_AUDIT_INCIDENT_ASSIGNEE }}
          incident-failure-threshold: ${{ vars.RELEASE_AUDIT_INCIDENT_FAILURE_THRESHOLD }}

  incident-self-test:
    name: incident self-test
    if: github.event_name == 'workflow_dispatch' && inputs.incident_self_test != 'none'
    runs-on: ubuntu-latest
    concurrency:
      group: release-secrets-audit-self-test-${{ inputs.target_environment }}
      cancel-in-progress: true
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine self-test status
        id: self_test
        shell: bash
        run: |
          node scripts/release_audit_mode.js \
            --event-name "${{ github.event_name }}" \
            --self-test-action "${{ inputs.incident_self_test }}" \
            --job-status "${{ job.status }}" >> "$GITHUB_OUTPUT"

      - name: Write audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Release Secrets Audit"
            echo
            echo "- Environment: \`${{ inputs.target_environment }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Status: \`${{ steps.self_test.outputs.effective_status }}\`"
            echo "- Incident self-test: \`${{ steps.self_test.outputs.self_test_action }}\`"
            echo "- Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Triage self-test incident
        if: always()
        continue-on-error: true
        uses: ./.github/actions/release-audit-incident
        with:
          target-environment: ${{ inputs.target_environment }}
          job-status: ${{ steps.self_test.outputs.effective_status }}
          self-test-action: ${{ steps.self_test.outputs.self_test_action }}
          incident-assignee: ${{ vars.RELEASE_AUDIT_INCIDENT_ASSIGNEE }}
          incident-failure-threshold: ${{ vars.RELEASE_AUDIT_INCIDENT_FAILURE_THRESHOLD }}
